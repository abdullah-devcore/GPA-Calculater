kind = "mobile"
previewPath = "/"
title = "GPA Calculator"
version = "1.0.0"
id = "artifacts/gpa-calculator"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 21485
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/gpa-calculator run dev"

[services.env]
PORT = "21485"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/gpa-calculator", "run", "build"]
run = ["pnpm", "--filter", "@workspace/gpa-calculator", "run", "serve"]
